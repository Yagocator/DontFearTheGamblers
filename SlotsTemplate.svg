  <title
     id="title1">Roulette Slot 00 Number 0</title>
  <!--
European roulette vector template generated for game use.
Canvas: 1024x1024. All slots share the same origin/size.
Slot IDs follow wheel position: slot_00 contains roulette number 0, slot_01 contains 32, etc.
Roulette number order: 0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26
Each sector is its own <g id="slot_XX_number_N"> object, so it can be hidden/exported separately in Inkscape.
-->
  <defs
     id="defs6">
    <radialGradient
       id="wheel_shadow"
       cx="50%"
       cy="50%"
       r="50%">
      <stop
         offset="0%"
         stop-color="#33240f"
         id="stop1" />
      <stop
         offset="70%"
         stop-color="#1a140b"
         id="stop2" />
      <stop
         offset="100%"
         stop-color="#050505"
         id="stop3" />
    </radialGradient>
    <radialGradient
       id="gold"
       cx="45%"
       cy="40%"
       r="60%">
